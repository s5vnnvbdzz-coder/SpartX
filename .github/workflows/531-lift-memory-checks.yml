name: 5/3/1 per-lift max checks
on:
  push:
    branches: [main]
    paths:
      - 'tools/replica.js'
      - 'tests/531-lift-memory.test.js'
      - '.github/workflows/531-lift-memory-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify saved per-lift 1RM and 90 percent training max
        run: node tests/531-lift-memory.test.js
