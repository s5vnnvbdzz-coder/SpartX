name: AscensionX v2 preview verification
on:
  pull_request:
    paths: ['assets/ascension/**','AscensionX/**','index.html','.github/workflows/ascension-v2-preview.yml']
  push:
    branches: [ascensionx-v2-programming-preview]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node assets/ascension/programming-v2.test.js
          node assets/ascension/programme-v2-lifecycle.test.js
          node assets/ascension/programme-v2-intelligence.test.js
          node assets/ascension/adaptive-programming.test.js
          node science/engine.test.js
          node science/volume-intelligence.test.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8765 > /tmp/ascension-preview-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/AscensionX/programme-preview.html >/dev/null && break; sleep 1; done
          node tests/ascension-v2-mobile.browser.test.cjs
