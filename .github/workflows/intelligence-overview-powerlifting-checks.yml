name: SpartanX Intelligence Powerlifting-First Overview

on:
  push:
    paths:
      - 'intelligence/index.html'
      - 'intelligence/app.js'
      - 'intelligence/styles.css'
      - 'assets/bodybuilding/decision-panels.js'
      - 'tests/intelligence-overview-powerlifting.test.js'
      - 'tests/intelligence-overview-powerlifting.mobile.py'
      - '.github/workflows/intelligence-overview-powerlifting-checks.yml'
  pull_request:
    paths:
      - 'intelligence/index.html'
      - 'intelligence/app.js'
      - 'intelligence/styles.css'
      - 'assets/bodybuilding/decision-panels.js'
      - 'tests/intelligence-overview-powerlifting.test.js'
      - 'tests/intelligence-overview-powerlifting.mobile.py'
      - '.github/workflows/intelligence-overview-powerlifting-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerlifting-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard scripts
        run: |
          node --check intelligence/app.js
          node --check assets/bodybuilding/decision-panels.js
      - name: Check priority order and linked-only powerlifting evidence
        run: node tests/intelligence-overview-powerlifting.test.js
      - name: Verify iPhone layout with saved AscensionX cycle
        run: |
          python3 -m pip install --quiet --break-system-packages selenium
          google-chrome --version
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spartanx-overview-server.log 2>&1 &
          python3 tests/intelligence-overview-powerlifting.mobile.py
