name: SpartanX Measures mobile smoke
on:
  push:
    branches: [main]
    paths:
      - "assets/profile/measures.js"
      - "assets/profile/measures.css"
      - "assets/anatomy/muscle-role.css"
      - "assets/stats/statistics.js"
      - "assets/stats/statistics.css"
      - "tests/measures.mobile.py"
      - ".github/workflows/measures-mobile-check.yml"
      - "index.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iPhone-measures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Measurements javascript
        run: node --check assets/profile/measures.js
      - name: Install Chrome test dependencies
        run: |
          google-chrome --version
          python3 -m pip install --quiet --break-system-packages selenium
      - name: Validate two Measures screens and muscle contrast at iPhone width
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/spartanx-measures-server.log 2>&1 &
          python3 tests/measures.mobile.py
