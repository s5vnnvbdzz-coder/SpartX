name: SpartanX live mobile workout flow diagnostic
on:
  workflow_run:
    workflows: ["Deploy SPARTANX to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-mobile-workout-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Set up browser tools
        run: |
          google-chrome --version || chromium --version
          python3 -m pip install --quiet --break-system-packages selenium
      - name: Exercise real live site on phone-sized browser
        run: |
          python3 - <<'PY'
          import time, traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_experimental_option('mobileEmulation',{'deviceMetrics':{'width':390,'height':844,'pixelRatio':3},'userAgent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'})
          options.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          browser=webdriver.Chrome(options=options)
          wait=WebDriverWait(browser,20)
          try:
            browser.get('https://s5vnnvbdzz-coder.github.io/SpartX/?mobile-ui-test=1')
            wait.until(lambda d:d.execute_script('return document.readyState')=='complete')
            time.sleep(1)
            print('URL:',browser.current_url)
            print('Root DOM data:',browser.execute_script('return {inputType:document.querySelector("#workoutName")?.type, customButton:!!document.querySelector("#openCustomExercise"), page:document.querySelector(".screen.active")?.id,build:document.body.textContent.match(/Build \\d+/)?.[0]}'))
            print('Browser errors:',[x['message'] for x in browser.get_log('browser') if x['level']=='SEVERE'][:12])
            browser.execute_script('document.querySelector("#trackerNav button[data-screen=workout]").click()')
            wait.until(lambda d:d.execute_script('return document.querySelector("#workout")?.classList.contains("active")'))
            browser.save_screenshot('/tmp/workout-logger.png')
            print('WORKOUT card:',browser.execute_script('return {name:document.querySelector("#workoutName")?.outerHTML,header:document.querySelector(".sx-start-energy-label")?.textContent,visible:document.querySelector("#workoutName")?.getBoundingClientRect().height}'))
            browser.execute_script('document.querySelector("#startWorkout").click()')
            wait.until(lambda d:d.execute_script('return document.querySelector("#activeWorkout")?.classList.contains("active")'))
            print('ACTIVE WORKOUT:',browser.execute_script('return document.querySelector("#activeWorkoutName")?.textContent'))
            # The compact summary keeps a clear timer/pause block, three readable
            # metrics and a diagram-only thumbnail at iPhone width.
            summary=browser.execute_script("""
              const card=document.querySelector('#activeWorkout .session-summary-bar');
              const diagram=document.querySelector('#openMuscleDiagram');
              const duration=document.querySelector('.session-duration-metric');
              const pause=document.querySelector('#sessionPauseButton');
              const volume=document.querySelector('#liveVolume');
              const sets=document.querySelector('#liveSets');
              const rect=el=>el.getBoundingClientRect();
              return {height:rect(card).height,
                diagramOnly:diagram.querySelectorAll('.tiny').length===0,
                accessible:diagram.getAttribute('aria-label')==='View muscles worked',
                pauseByTimer:rect(pause).left>=rect(duration).left,
                pauseClearOfVolume:rect(pause).right+5<rect(volume).left,
                volumeClearOfSets:rect(volume).right<=rect(sets).left,
                diagramVisible:rect(diagram).width>0&&rect(diagram).height>0};""")
            print('ACTIVE SESSION COMPACT SUMMARY:',summary)
            assert summary['height']<120, 'Summary card should be compact on phone'
            assert all(v for k,v in summary.items() if k!='height'), 'Diagram, spacing and timer layout should be clear'
            browser.save_screenshot('/tmp/active-workout-summary.png')
            # Active Session Options is a true scroll-locking dialog, not a dropdown.
            browser.execute_script('document.querySelector("#sessionOptionsButton").click()')
            wait.until(lambda d:d.execute_script('return !document.querySelector("#sessionOptionsMenu").hidden'))
            modal=browser.execute_script("""return {
              dialog:document.querySelector('#sxSessionOptionsDialog').getAttribute('role'),
              bodyLocked:document.body.style.position==='fixed',
              htmlLocked:document.documentElement.style.overflow==='hidden',
              choiceCount:document.querySelectorAll('#sxSessionOptionsLinks button').length
            }""")
            print('SESSION OPTIONS:',modal)
            assert modal=={'dialog':'dialog','bodyLocked':True,'htmlLocked':True,'choiceCount':2}
            # The shared calculator must open expanded with no collapse button.
            browser.execute_script('document.querySelector("#start531Shortcut").click()')
            wait.until(lambda d:d.execute_script('return !document.querySelector("#sxQuick531Overlay").hidden'))
            calc_popup=browser.execute_script("""const host=document.querySelector('#toolsReplica');
              const card=host.shadowRoot.querySelector('section[aria-labelledby="531Title"]');
              return {bodyLocked:document.body.style.position==='fixed',
                expanded:!card.classList.contains('is-collapsed'),
                noCollapse:getComputedStyle(card.querySelector('.card-collapse')).display==='none',
                inPopup:document.querySelector('#sxQuick531Mount').contains(host)};""")
            print('SESSION 5/3/1:',calc_popup)
            assert all(calc_popup.values()), '5/3/1 must be expanded with hidden collapse button'
            browser.execute_script('document.querySelector("#sxClose531Quick").click()')
            wait.until(lambda d:d.execute_script('return document.querySelector("#sxQuick531Overlay").hidden'))
            assert browser.execute_script("return document.body.style.position!=='fixed'")
            # AscensionX launches inside the same workflow, locks the SpartanX
            # background and Cancel returns directly to this active session.
            browser.execute_script('document.querySelector("#sessionOptionsButton").click();document.querySelector("#startAscensionShortcut").click()')
            wait.until(lambda d:d.execute_script('''const p=document.querySelector("#sxAscensionPortalHost")?.shadowRoot;
              return !!p?.getElementById("ascensionXOverlay")?.classList.contains("open");'''))
            asc_popup=browser.execute_script('''const p=document.querySelector("#sxAscensionPortalHost").shadowRoot;
              return {quick:p.getElementById("ascensionXOverlay").classList.contains("sx-ascension-quick"),
                bodyLocked:document.body.style.position==="fixed",
                htmlLocked:document.documentElement.style.overflow==="hidden",
                activeWorkout:document.querySelector(".screen.active")?.id==="activeWorkout"};''')
            print('ASCENSIONX MODAL:',asc_popup)
            assert all(asc_popup.values()), 'AscensionX must be a modal above an unchanged active workout'
            wait.until(lambda d:d.execute_script('''const f=document.querySelector("#sxAscensionPortalHost").shadowRoot.getElementById("ascensionXEmbedFrame");
              return !!f.contentWindow?.cancelAscSpartanImport&&f.contentDocument?.body?.classList.contains("sx-spartan-quick-import");'''))
            browser.execute_script('''document.querySelector("#sxAscensionPortalHost").shadowRoot.getElementById("ascensionXEmbedFrame").contentWindow.cancelAscSpartanImport();''')
            wait.until(lambda d:d.execute_script('''const p=document.querySelector("#sxAscensionPortalHost").shadowRoot;
              return !p.getElementById("ascensionXOverlay").classList.contains("open");'''))
            after_cancel=browser.execute_script('''return {activeWorkout:document.querySelector(".screen.active")?.id==="activeWorkout",
              bodyRestored:document.body.style.position!=="fixed",
              htmlRestored:document.documentElement.style.overflow!=="hidden"};''')
            print('ASCENSIONX CANCEL RETURNS TO WORKOUT:',after_cancel)
            assert after_cancel=={'activeWorkout':True,'bodyRestored':True,'htmlRestored':True}
            browser.execute_script('document.querySelector("#openExerciseLibrary").click()')
            wait.until(lambda d:d.execute_script('return document.querySelector("#exerciseLibraryScreen")?.classList.contains("active")'))
            result=browser.execute_script('''const h=document.querySelector("#sxHeaderExerciseControls"),brand=document.querySelector("#sxBrandHeader"),rect=h.getBoundingClientRect(),head=document.querySelector("body>header").getBoundingClientRect();return {title:h?.querySelector("h1")?.textContent,custom:document.querySelector("#openCustomExercise")?.textContent,back:document.querySelector("#closeExerciseLibrary")?.textContent,parent:h?.parentElement?.tagName,headerVisible:rect.height>0,brandHidden:getComputedStyle(brand).display==="none",headerTop:head.top,headerBottom:head.bottom,controlsTop:rect.top,controlsBottom:rect.bottom,controlsWidth:rect.width,viewportWidth:innerWidth};''')
            print('LIVE EXERCISE HEADER:',result)
            assert result['parent']=='HEADER', 'Exercise controls must be inside the global header'
            assert result['title']=='Add Exercise' and result['custom']=='Custom +' and result['back']=='← Back'
            assert result['headerVisible'] and result['brandHidden'], 'Header should replace SpartanX branding on this screen'
            assert result['controlsTop']>=result['headerTop']-2 and result['controlsBottom']<=result['headerBottom']+2, 'Buttons must fit in global header'
            assert result['controlsWidth']<=result['viewportWidth'], 'Header must fit phone viewport'
            browser.save_screenshot('/tmp/add-exercise.png')
            browser.execute_script('document.querySelector("#openCustomExercise").click()')
            wait.until(lambda d:d.execute_script('return document.querySelector("#customExerciseDialog")?.open'))
            print('CUSTOM POPUP OPEN: true')
            browser.execute_script('document.querySelector("#closeCustomExercise").click();document.querySelector("#trackerNav button[data-screen=tools]").click();')
            wait.until(lambda d:d.execute_script('return document.querySelector("#tools")?.classList.contains("active")'))
            lift_data=browser.execute_script("""
            const root=document.querySelector('#toolsReplica').shadowRoot;
            const lift=root.getElementById('applyLift'),rm=root.getElementById('tmFinderOneRm'),tm=root.getElementById('tm');
            function pick(name,oneRm){
              lift.value=name;
              lift.dispatchEvent(new Event('change',{bubbles:true}));
              if(oneRm!==null){
                rm.value=oneRm;
                rm.dispatchEvent(new Event('input',{bubbles:true}));
              }
              return [lift.value,rm.value,tm.value];
            }
            const sequence=[
              pick('Bench Press','160'),
              pick('Back Squat','180'),
              pick('Conventional Deadlift','210'),
              pick('Bench Press',null),
              pick('Back Squat',null),
              pick('Conventional Deadlift',null)
            ];
            return {sequence,storage:JSON.parse(localStorage.getItem('spartxToolsInputs'))};
            """)
            expected=[
              ['Bench Press','160','145'],['Back Squat','180','162.5'],
              ['Conventional Deadlift','210','190'],['Bench Press','160','145'],
              ['Back Squat','180','162.5'],['Conventional Deadlift','210','190']
            ]
            print('5/3/1 LIVE SEQUENCE:',lift_data['sequence'])
            assert lift_data['sequence']==expected, '5/3/1 must restore each lift 1RM and 90% TM'
            assert lift_data['storage']['oneRmsByLiftKg']=={'Back Squat':180,'Bench Press':160,'Conventional Deadlift':210}
            browser.refresh()
            wait.until(lambda d:d.execute_script('return !!document.querySelector("#toolsReplica")?.shadowRoot?.getElementById("applyLift")'))
            persisted=browser.execute_script("""
              const root=document.querySelector('#toolsReplica').shadowRoot;
              return [root.getElementById('applyLift').value,root.getElementById('tmFinderOneRm').value,root.getElementById('tm').value];
            """)
            print('5/3/1 AFTER RELOAD:',persisted)
            assert persisted==['Conventional Deadlift','210','190'], '5/3/1 values must persist on page reload'
            print('PASS: live mobile Workout Logger, Add Exercise and 5/3/1 saved per-lift TM')
          except Exception:
            print('CURRENT PAGE:',browser.current_url)
            print('ERROR LOGS:',browser.get_log('browser'))
            traceback.print_exc()
            browser.save_screenshot('/tmp/error-workout.png')
            raise
          finally:
            browser.quit()
          PY
      - name: Upload diagnostic screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spartanx-mobile-ui-screenshots
          path: |
            /tmp/*workout*.png
            /tmp/*exercise*.png
          if-no-files-found: ignore
