name: SpartanX modal viewport browser checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'AscensionX/index.html'
      - 'assets/ui/modal-viewport.*'
      - 'assets/ascension/quick-access.js'
      - 'tests/modal-viewport.browser.test.cjs'
      - '.github/workflows/modal-viewport.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/spartanx-modal-server.log 2>&1 &
          node tests/modal-viewport.browser.test.cjs
