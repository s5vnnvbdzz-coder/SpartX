name: Diagnose GitHub Pages publishing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-health.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration and stalled deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo '=== Pages configuration ==='
          gh api "repos/${GH_REPO}/pages" --jq '{status,build_type,source,html_url}' || true
          echo '=== Latest Pages deployment ==='
          gh api "repos/${GH_REPO}/pages/deployments/latest" --jq '{status,id,errors}' || true
          echo '=== Stalled version record ==='
          gh api "repos/${GH_REPO}/pages/deployments/a34dd4e2117bb371d5d9ede05776d887609deb7c" --jq '{status,id,errors}' || true
          echo '=== Pages general deployments ==='
          gh api "repos/${GH_REPO}/deployments?environment=github-pages&per_page=4" --jq '[.[] | {id,sha,created_at,updated_at}]' || true
      - name: Switch Pages to GitHub Actions deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${GH_REPO}/pages" -f build_type=workflow
          gh api "repos/${GH_REPO}/pages" --jq '{status,build_type,source,html_url}'
      - name: Publish current main branch through dedicated workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/${GH_REPO}/actions/workflows/pages.yml/dispatches" -f ref=main
          echo "Triggered dedicated Pages publishing workflow"

