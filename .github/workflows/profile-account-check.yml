name: Verify SpartanX Profile Account and Preferences
on:
  push:
    paths:
      - ".github/workflows/profile-account-check.yml"
      - "assets/profile/profile-account-preferences.js"
      - "assets/profile/profile-photo-crop.js"
      - "assets/profile/profile-photo-crop.css"
      - "assets/profile/profile-account-preferences.css"
      - "index.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-profile-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser checks
        run: |
          google-chrome --version
          python3 -m pip install --quiet --break-system-packages selenium
      - name: Verify mobile profile, account, birthday and settings on published site
        run: |
          python3 - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.support.ui import WebDriverWait
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_experimental_option('mobileEmulation',{'deviceMetrics':{'width':390,'height':844,'pixelRatio':3}})
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          browser=webdriver.Chrome(options=opts)
          wait=WebDriverWait(browser,25)
          def evaluate(code,*args):
            return browser.execute_script(code,*args)
          def click(selector):
            evaluate("document.querySelector(arguments[0]).click()",selector)
          def change(selector,value):
            evaluate("const e=document.querySelector(arguments[0]);e.value=arguments[1];e.dispatchEvent(new Event('change',{bubbles:true}));",selector,value)
          try:
            browser.get('https://s5vnnvbdzz-coder.github.io/SpartX/?profile-account-check=242')
            wait.until(lambda b:evaluate("return document.querySelector('#sxSettingsDashboard')!==null"))
            click("#trackerNav button[data-screen='profile']")
            wait.until(lambda b:evaluate("return document.querySelector('#profile').classList.contains('active')"))
            assert evaluate("return document.querySelectorAll('#trackerNav button').length")==4
            # The profile portrait and theme frame must have concentric centres.
            portrait=evaluate("""const wrap=document.querySelector('#profile .sx-profile-avatar-wrap'),
              photo=document.querySelector('#profileAvatar'),medal=wrap?.querySelector('.sx-profile-rank-emblem');
              const r=el=>el.getBoundingClientRect(),a=r(wrap),b=r(photo);
              return {centred:Math.abs((a.left+a.width/2)-(b.left+b.width/2))<1&&
                   Math.abs((a.top+a.height/2)-(b.top+b.height/2))<1,
                   crop:getComputedStyle(photo).overflow==='hidden',
                   cover:getComputedStyle(photo).clipPath.includes('circle'),
                   badge:!!medal,
                   badgeSource:medal?.getAttribute('src'),
                   expected:'./ranks/'+getWorkoutRank().current.file};""")
            print('PROFILE AVATAR / RANK EMBLEM:',portrait)
            assert portrait['centred'] and portrait['crop'] and portrait['cover'] and portrait['badge']
            assert portrait['badgeSource']==portrait['expected'],'Medal must show the active rank file'
            # Verify an actual photo covers the entire circular viewport.
            photo_metrics=evaluate("""db.profile=db.profile||{};
              db.profile.photo='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
              renderProfile();
              const c=document.querySelector('#profileAvatar').getBoundingClientRect();
              const i=document.querySelector('#profileAvatar img').getBoundingClientRect();
              return {hasImage:!!document.querySelector('#profileAvatar img'),
                      fullSize:Math.abs(c.width-i.width)<1&&Math.abs(c.height-i.height)<1,
                      centered:Math.abs((c.left+c.width/2)-(i.left+i.width/2))<1&&
                        Math.abs((c.top+c.height/2)-(i.top+i.height/2))<1};""")
            assert all(photo_metrics.values()),photo_metrics
            # Both workout XP and the gender-specific rank set refresh the badge.
            badge_refresh=evaluate("""db.profile.standard='female';
              db.sessions=Array.from({length:3},(_,i)=>({id:'qa-rank-'+i,date:new Date().toISOString(),
                duration:60,volume:0,exercises:[]}));
              renderProfile();
              const female=getWorkoutRank();
              const image=document.querySelector('.sx-profile-rank-emblem');
              return {name:female.current.name,expected:'./ranks/'+female.current.file,
                      actual:image.getAttribute('src')};""")
            assert badge_refresh['name']=='Huntress' and badge_refresh['expected']==badge_refresh['actual'],badge_refresh
            # Restore a clean profile before testing the form.
            evaluate("db.sessions=[];db.profile.standard='';db.profile.photo='';renderProfile();")
            click('#editProfile')
            wait.until(lambda b:evaluate("return !document.querySelector('#editProfileOverlay').classList.contains('hidden')"))
            # Circular selector: one-finger drag, two-finger pinch, and instant save.
            assert evaluate("return !!window.SpartanXPhotoCrop")
            assert not evaluate("return !!document.querySelector('#sxPhotoCropSize')"),'Slider must be removed'
            def pick_photo():
              return browser.execute_async_script("""
                const done=arguments[arguments.length-1];
                const canvas=document.createElement('canvas');canvas.width=200;canvas.height=400;
                const ctx=canvas.getContext('2d');
                ctx.fillStyle='#ef3333';ctx.fillRect(0,0,200,400);
                ctx.fillStyle='#2d50f1';ctx.fillRect(100,0,100,400);
                canvas.toBlob(blob=>{
                  const file=new File([blob],'avatar-test.png',{type:'image/png'});
                  const input=document.querySelector('#profilePhotoInput');
                  const data=new DataTransfer();data.items.add(file);
                  input.files=data.files;input.dispatchEvent(new Event('change',{bubbles:true}));
                  done(true);
                },'image/png');
              """)
            assert pick_photo()
            wait.until(lambda b:evaluate("""return !document.querySelector('#sxPhotoCropOverlay').hidden
              && !document.querySelector('#sxPhotoCropApply').disabled"""))
            initial=evaluate("""const circle=document.querySelector('#sxPhotoCropCircle'),
              surface=document.querySelector('#sxPhotoCropSurface');
              return {size:parseFloat(circle.style.width),top:parseFloat(circle.style.top),
                surfaceWidth:surface.clientWidth,surfaceHeight:surface.clientHeight,
                photoStillUnsaved:!document.querySelector('#editProfileOverlay').dataset.pendingPhoto};""")
            assert initial['size']>70 and initial['photoStillUnsaved'],initial
            # Simulate two iPhone touch pointers moving together to shrink the circle.
            pinch=evaluate("""const surface=document.querySelector('#sxPhotoCropSurface');
              const circle=document.querySelector('#sxPhotoCropCircle');
              const r=surface.getBoundingClientRect();
              const cx=r.left+r.width/2,cy=r.top+r.height/2;
              const send=(type,id,x,y)=>surface.dispatchEvent(new PointerEvent(type,{
                bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:id===91,
                button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y}));
              send('pointerdown',91,cx-45,cy);
              send('pointerdown',92,cx+45,cy);
              send('pointermove',91,cx-24,cy);
              send('pointermove',92,cx+24,cy);
              const shrink=parseFloat(circle.style.width);
              send('pointermove',91,cx-60,cy);
              send('pointermove',92,cx+60,cy);
              const grow=parseFloat(circle.style.width);
              send('pointerup',92,cx+60,cy);
              send('pointerup',91,cx-60,cy);
              return {shrink,grow,original:parseFloat(circle.style.width),
                visible:!document.querySelector('#sxPhotoCropOverlay').hidden};""")
            print('PINCH TEST:',pinch,flush=True)
            assert pinch['shrink']<initial['size']-10,pinch
            assert pinch['grow']>pinch['shrink']+10,pinch
            # One-finger drag must still work after a completed pinch.
            original_top=evaluate("return parseFloat(document.querySelector('#sxPhotoCropCircle').style.top)")
            avatar_circle=browser.find_element(By.CSS_SELECTOR,'#sxPhotoCropCircle')
            ActionChains(browser).move_to_element(avatar_circle).click_and_hold().move_by_offset(0,17).release().perform()
            moved=evaluate("return parseFloat(document.querySelector('#sxPhotoCropCircle').style.top)")
            assert moved>original_top+4,(moved,original_top)
            click('#sxPhotoCropCancel')
            assert evaluate("return document.querySelector('#sxPhotoCropOverlay').hidden")
            assert not evaluate("return (db.profile||{}).photo"),'Cancel must keep existing profile photo'
            assert not evaluate("return document.querySelector('#editProfileOverlay').classList.contains('hidden')")
            assert pick_photo()
            wait.until(lambda b:evaluate("""return !document.querySelector('#sxPhotoCropOverlay').hidden
              && !document.querySelector('#sxPhotoCropApply').disabled"""))
            click('#sxPhotoCropApply')
            result=evaluate("""return {
              hidden:document.querySelector('#sxPhotoCropOverlay').hidden,
              saved:db.profile?.photo||'',
              persisted:JSON.parse(localStorage.getItem('spartx_db')||'{}').profile?.photo||'',
              preview:document.querySelector('#editProfileAvatar img')?.getAttribute('src')||'',
              visible:document.querySelector('#profileAvatar img')?.getAttribute('src')||'',
              pending:document.querySelector('#editProfileOverlay').dataset.pendingPhoto||''
            };""")
            assert result['hidden'],result
            assert result['saved'].startswith('data:image/jpeg;base64,'),result
            assert result['persisted']==result['saved'], 'Use This Crop must save before Save Profile'
            assert result['preview']==result['saved'] and result['visible']==result['saved']
            assert not result['pending'], 'Do not leave a stale pending-photo overwrite'
            assert not evaluate("return document.querySelector('#editProfileOverlay').classList.contains('hidden')")
            # Cancel the Profile editor after cropping; confirmed photo must remain.
            click('#cancelEditProfile')
            assert evaluate("return JSON.parse(localStorage.getItem('spartx_db')).profile.photo") == result['saved']
            click('#editProfile')
            assert evaluate("return document.querySelectorAll('#profileBirthdayMonth option').length")==13
            assert evaluate("return [...document.querySelector('#profileBirthdayYear').options].some(o=>o.value==='1960')")
            change('#profileBirthdayYear','2000');change('#profileBirthdayMonth','2')
            assert evaluate("return [...document.querySelector('#profileBirthdayDay').options].some(o=>o.value==='29')"),'2000 must allow Feb 29'
            change('#profileBirthdayYear','2001')
            assert not evaluate("return [...document.querySelector('#profileBirthdayDay').options].some(o=>o.value==='29')"),'2001 must not allow Feb 29'
            change('#profileBirthdayYear','2000');change('#profileBirthdayDay','29')
            evaluate("""document.querySelector('#profileNameInput').value='QA Athlete';
              document.querySelector('#profileBioInput').value='Training and testing https://instagram.com/example';
              document.querySelector('#profileLinksInput').value='example.com\\ninstagram.com/example';""")
            click('#saveProfile')
            wait.until(lambda b:evaluate("return document.querySelector('#editProfileOverlay').classList.contains('hidden')"))
            profile=evaluate("return JSON.parse(localStorage.getItem('spartx_db'))?.profile")
            assert profile['birthday']=='2000-02-29',profile
            assert profile.get('photo','').startswith('data:image/jpeg;base64,'),'Saved profile must use the confirmed circular photo crop'
            assert len(profile['links'])==2,profile
            assert 'instagram.com' in profile['bio'],profile
            assert evaluate("return document.querySelectorAll('#sxProfilePublicLinks a').length")==2
            click('#openProfileSettings')
            wait.until(lambda b:evaluate("return !document.querySelector('#profileSettingsOverlay').classList.contains('hidden')"))
            assert evaluate("return !!document.querySelector('#sxSettingsAccount')&&!!document.querySelector('#sxSettingsLanguage')")
            # Settings -> Profile editor must use the Account-style Back header.
            click('#sxSettingsEditProfile')
            wait.until(lambda b:evaluate("return !document.querySelector('#editProfileOverlay').classList.contains('hidden')"))
            assert evaluate("return document.querySelector('#editProfileTitle').textContent.trim()")=='Profile'
            assert evaluate("return document.querySelector('#closeEditProfile').textContent.trim()")=='← Back'
            click('#closeEditProfile')
            assert not evaluate("return document.querySelector('#profileSettingsOverlay').classList.contains('hidden')"),'Back from Settings Profile must return to Settings'
            assert evaluate("return document.querySelector('#editProfileOverlay').classList.contains('hidden')")
            # Cancel should likewise return to the original Settings window.
            click('#sxSettingsEditProfile')
            click('#cancelEditProfile')
            assert not evaluate("return document.querySelector('#profileSettingsOverlay').classList.contains('hidden')")
            # Save should also return to Settings with existing fields retained.
            click('#sxSettingsEditProfile')
            click('#saveProfile')
            assert not evaluate("return document.querySelector('#profileSettingsOverlay').classList.contains('hidden')"),'Save Profile from Settings should reopen Settings'
            # Direct Profile edit should return to the Profile page, not Settings.
            click('#closeProfileSettings')
            click('#editProfile')
            click('#closeEditProfile')
            assert evaluate("return document.querySelector('#profileSettingsOverlay').classList.contains('hidden')"),'Direct Profile edit Back should stay on Profile'
            click('#openProfileSettings')
            click('#sxSettingsUnits')
            assert evaluate("return !document.querySelector('#sxSettingsSubpage').hidden")
            assert evaluate("return !!document.querySelector('#sxSettingsSubpage #unitWeight')")
            change('#unitWeight','lb')
            click('#sxSettingsBack')
            click('#sxSettingsLanguage')
            change('#sxLanguageSelection','fr')
            click('.sx-settings-save')
            prefs=evaluate("return JSON.parse(localStorage.getItem('spartx_preferences_v1'))")
            assert prefs['weight']=='lb' and prefs['language']=='fr',prefs
            click('#sxSettingsAccount')
            evaluate("""document.querySelector('#sxAccountUsername').value='qa_athlete';
              document.querySelector('#sxAccountEmail').value='qa@example.test';""")
            assert evaluate("return !!document.querySelector('.sx-disabled-password:disabled')")
            click('#sxSaveAccount')
            db=evaluate("return JSON.parse(localStorage.getItem('spartx_db'))")
            assert db['account']['email']=='qa@example.test'
            assert db['profile']['username']=='qa_athlete'
            assert evaluate("return document.querySelector('#sxProfileHandle').textContent")=='qa_athlete'
            click('#closeProfileSettings')
            for kind in ('followers','following'):
              assert evaluate("return getComputedStyle(document.querySelector('#profile [data-sx-social-jump='+arguments[0]+']')).borderTopWidth",kind)=='0px'
              click("#profile [data-sx-social-jump='"+kind+"']")
              assert evaluate("return document.querySelector('#sxProfileConnectionsTitle').textContent")==kind.capitalize()
              click('#sxProfileConnectionsBack')
            browser.save_screenshot('/tmp/spartanx-profile-account-242.png')
            assert evaluate("return document.querySelectorAll('#trackerNav button').length")==4
            print('PASS: profile editor, birthday leap-year, links, units, language, account, social lists and navigation')
            print('Browser severe logs:',[x['message'] for x in browser.get_log('browser') if x['level']=='SEVERE'])
          finally:
            browser.quit()
          PY
      - name: Save profile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spartanx-profile-account-preview
          path: /tmp/spartanx-profile-account-242.png
          if-no-files-found: ignore
