name: Recover stalled GitHub Pages deployment

# One-time maintenance job, targeting only the stale deployment from GitHub logs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stuck-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GH_REPO}/pages/deployments/a34dd4e2117bb371d5d9ede05776d887609deb7c/cancel"
          echo 'Sent cancellation request for stale deployment a34dd4e2'
