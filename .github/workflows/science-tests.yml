name: Scientific Training Engine Tests
on:
  push:
    branches:
      - main
      - 'feature/intelligence-*'
    paths:
      - 'assets/science/**'
      - 'assets/ascension/adaptive-programming.js'
      - 'assets/bodybuilding/**'
      - 'intelligence/**'
      - 'science/**'
      - '.github/workflows/science-tests.yml'
  pull_request:
    paths:
      - 'assets/science/**'
      - 'assets/ascension/adaptive-programming.js'
      - 'assets/bodybuilding/**'
      - 'intelligence/**'
      - 'science/**'
      - '.github/workflows/science-tests.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check shared modules
        run: |
          node --check assets/science/evidence-engine.js
          node --check assets/science/volume-intelligence.js
          node --check intelligence/scientific-panel.js
          node --check assets/ascension/adaptive-programming.js
          node --check assets/bodybuilding/programme-model.js
          node --check assets/bodybuilding/programme-builder.js
      - name: Scientific programme generation regression
        run: node science/engine.test.js
      - name: Unified working set and source integration regression
        run: node science/volume-intelligence.test.js
