name: Scientific Training Engine Tests
on:
  push:
    branches:
      - feature/phase2-scientific-engine-v01-20261121
    paths:
      - 'assets/science/**'
      - 'science/**'
      - '.github/workflows/science-tests.yml'
  pull_request:
    paths:
      - 'assets/science/**'
      - 'science/**'
      - '.github/workflows/science-tests.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check assets/science/evidence-engine.js && node --check science/engine.test.js
      - name: Scientific engine regression checks
        run: node science/engine.test.js
