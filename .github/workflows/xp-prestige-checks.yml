name: Verify SpartanX XP and Prestige rewards
on:
  push:
    branches: [main]
    paths:
      - 'assets/ranks/xp-engine.js'
      - 'assets/ranks/xp-engine.test.cjs'
      - 'assets/ranks/prestige-showcase.js'
      - 'assets/ranks/prestige-showcase.test.cjs'
      - 'assets/ranks/prestige-visuals.css'
      - 'assets/ranks/milestone-engine.js'
      - 'assets/ranks/milestone-engine.test.cjs'
      - 'assets/ranks/milestone-modal.js'
      - 'assets/ranks/milestone-modal.css'
      - 'assets/profile/profile-preview-parity.js'
      - 'index.html'
      - '.github/workflows/xp-prestige-checks.yml'
  pull_request:
    paths:
      - 'assets/ranks/xp-engine.js'
      - 'assets/ranks/xp-engine.test.cjs'
      - 'assets/ranks/prestige-showcase.js'
      - 'assets/ranks/prestige-showcase.test.cjs'
      - 'assets/ranks/prestige-visuals.css'
      - 'assets/ranks/milestone-engine.js'
      - 'assets/ranks/milestone-engine.test.cjs'
      - 'assets/ranks/milestone-modal.js'
      - 'assets/ranks/milestone-modal.css'
      - 'assets/profile/profile-preview-parity.js'
      - 'index.html'
      - '.github/workflows/xp-prestige-checks.yml'
permissions:
  contents: read
jobs:
  validate-rank-xp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate XP engine and Prestige Showcase syntax
        run: |
          node --check assets/ranks/xp-engine.js
          node --check assets/ranks/prestige-showcase.js
          node --check assets/ranks/milestone-engine.js
          node --check assets/ranks/milestone-modal.js
      - name: Test rank XP, lifetime insignias and badge permanence
        run: node assets/ranks/xp-engine.test.cjs
      - name: Test Showcase and laurel unlock celebration
        run: node assets/ranks/prestige-showcase.test.cjs
      - name: Test lifetime milestone progress and cycle verification
        run: node assets/ranks/milestone-engine.test.cjs
