<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Abstract silver and violet energy aura">
 <defs>
  <radialGradient id="aura" cx="78%" cy="51%" r="50%">
   <stop offset="0" stop-color="#e1ebff" stop-opacity=".60"/>
   <stop offset=".18" stop-color="#779dff" stop-opacity=".36"/>
   <stop offset=".43" stop-color="#6650bf" stop-opacity=".26"/>
   <stop offset=".75" stop-color="#241958" stop-opacity=".10"/>
   <stop offset="1" stop-color="#080b16" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="inner" cx="63%" cy="45%" r="61%">
   <stop stop-color="#d8e7ff" stop-opacity=".75"/>
   <stop offset=".39" stop-color="#8bb2ff" stop-opacity=".28"/>
   <stop offset="1" stop-color="#8b63fc" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#f4f8ff" stop-opacity=".78"/>
   <stop offset=".42" stop-color="#87b5ff" stop-opacity=".88"/>
   <stop offset="1" stop-color="#c3a3ff" stop-opacity=".33"/>
  </linearGradient>
  <linearGradient id="silhouette" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#0b1230"/><stop offset=".56" stop-color="#1c2450"/><stop offset="1" stop-color="#060916"/>
  </linearGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
   <feGaussianBlur stdDeviation="17"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
   <feGaussianBlur stdDeviation="4.5" result="soft"/>
   <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>
 <!-- Intentionally transparent around the left text zone. -->
 <ellipse cx="728" cy="260" rx="360" ry="290" fill="url(#aura)"/>
 <ellipse cx="741" cy="236" rx="210" ry="238" fill="url(#inner)" filter="url(#blur)"/>
 <!-- Cascading original lightning marks, weighted to the outer right edge. -->
 <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path d="M610 480 653 407 627 370 682 306 673 246 721 179 696 131 764 35" stroke="#8baeff" stroke-width="3.5" opacity=".64"/>
  <path d="M759 12 748 91 795 122 765 180 822 211 796 280 849 332 813 379 873 436" stroke="#c9daff" stroke-width="3" opacity=".53"/>
  <path d="M536 353 583 314 568 253 623 197 603 142 655 81" stroke="#b4a3ff" stroke-width="2.8" opacity=".45"/>
  <path d="M849 65 821 116 877 153 835 202 911 251 859 308 932 354" stroke="#879cf4" stroke-width="3" opacity=".45"/>
  <path d="M591 25 618 87 605 131 660 171" stroke="#e3eaff" stroke-width="2.2" opacity=".39"/>
  <path d="M687 466 714 422 694 397 745 355 736 315" stroke="#d4c9ff" stroke-width="3" opacity=".49"/>
 </g>
 <!-- Silver ascending spikes: an original atmospheric martial-arts motif. -->
 <g opacity=".90" filter="url(#glow)">
  <path d="M672 179 647 101 689 124 708 39 739 113 785 16 782 113 839 80 808 152 865 137 825 199 796 225 721 229Z" fill="url(#ice)" opacity=".78"/>
  <path d="m665 157 35 31 8-103 30 95 45-123-12 131 64-72-38 92" fill="none" stroke="#f1f5ff" stroke-width="4.8" opacity=".68" stroke-linecap="round"/>
  <path d="M688 206 Q724 181 764 197 L792 231 Q793 270 756 286 L723 279 Q683 251 688 206Z" fill="url(#silhouette)" stroke="#b7d1ff" stroke-width="2" opacity=".81"/>
  <path d="M675 280 706 302 740 312 780 296 804 271 828 320 875 352 890 500 634 500 652 363 615 337Z" fill="url(#silhouette)" stroke="#8eaef1" stroke-width="2.2" opacity=".76"/>
  <path d="M703 303 Q741 337 790 297 M667 345 Q723 378 802 337 M656 417 717 385 752 462 789 381 848 419" fill="none" stroke="#b8c9fc" stroke-width="4" opacity=".58"/>
 </g>
 <g fill="#fff">
  <circle cx="566" cy="158" r="2.1" opacity=".7"/><circle cx="887" cy="98" r="1.5" opacity=".72"/>
  <circle cx="813" cy="32" r="1.8" opacity=".59"/><circle cx="916" cy="292" r="1.9" opacity=".62"/>
  <circle cx="608" cy="432" r="1.7" opacity=".51"/><circle cx="541" cy="275" r="1.7" opacity=".47"/>
 </g>
</svg>