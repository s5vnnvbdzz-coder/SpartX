/* CardGrade AI optical detector v2 — on-device, zero network dependencies.
 * Detects a contrasting, rectangular card, rectifies its perspective, and

(() => {
'use strict';

  if(!width||!height)throw Error('No visible camera frame');

  const c=canvas(Math.max(1,Math.round(width*scale)),Math.max(1,Math.round(height*scale)));

  return {canvas:c,image:ctx.getImageData(0,0,c.width,c.height),w:c.width,h:c.height};

const fl=fit.x+fit.w*.06,fr=fit.x+fit.w*.94,ft=fit.y+fit.h*.06,fb=fit.y+fit.h*.94;
const lp=best(true,fl,fit.x+fit.w*.28,fit.y+fit.h*.18,fit.y+fit.h*.82),rp=best(true,fit.x+fit.w*.72,fr,fit.y+fit.h*.18,fit.y+fit.h*.82);
const tp=best(false,ft,fit.y+fit.h*.28,fit.x+fit.w*.2,fit.x+fit.w*.8),bp=best(false,fit.y+fit.h*.72,fb,fit.x+fit.w*.2,fit.x+fit.w*.8);
let x=lp.pos/w,y=tp.pos/h,r=rp.pos/w,b=bp.pos/h;
// Bad silhouette guesses are replaced by conservative guides centered on the photo.
if((r-x)<.36||(b-y)<.42||(r-x)>.96||(b-y)>.97){x=(fit.x+fit.w*.10)/w;r=(fit.x+fit.w*.90)/w;y=(fit.y+fit.h*.10)/h;b=(fit.y+fit.h*.90)/h}
const outer={x,y,w:r-x,h:b-y};
const chooseInset=(isX,from,to,bLo,bHi,fallback)=>{const v=best(isX,from,to,bLo,bHi);return v.strength>6?v.pos:fallback};
const left=chooseInset(true,x*w+outer.w*w*.035,x*w+outer.w*w*.135,y*h+outer.h*h*.25,y*h+outer.h*h*.75,(x+outer.w*.075)*w)/w;
const right=chooseInset(true,r*w-outer.w*w*.135,r*w-outer.w*w*.035,y*h+outer.h*h*.25,y*h+outer.h*h*.75,(r-outer.w*.075)*w)/w;
const top=chooseInset(false,y*h+outer.h*h*.035,y*h+outer.h*h*.135,x*w+outer.w*w*.25,x*w+outer.w*w*.75,(y+outer.h*.075)*h)/h;
const bottom=chooseInset(false,b*h-outer.h*h*.135,b*h-outer.h*h*.035,x*w+outer.w*w*.25,x*w+outer.w*w*.75,(b-outer.h*.075)*h)/h;
return {outer,inner:{x:left,y:top,w:right-left,h:bottom-top}}}
function bindCalibrator(){const stage=$('#calibrationStage');if(!stage)return;let start=null;
stage.querySelectorAll('.guide-rect').forEach(rect=>rect.addEventListener('pointerdown',e=>{if(e.button!=null&&e.button!==0)return;e.preventDefault();e.stopPropagation();const side=step===0?'front':'back',type=rect.dataset.box,p=draft[side],r=p[type],h=e.target.dataset.handle||'move';start={id:e.pointerId,type,handle:h,x:e.clientX,y:e.clientY,r:{...r}};rect.setPointerCapture(e.pointerId)}));
stage.addEventListener('pointermove',e=>{if(!start||e.pointerId!==start.id)return;e.preventDefault();const side=step===0?'front':'back',r={...start.r},dx=(e.clientX-start.x)/stage.getBoundingClientRect().width,dy=(e.clientY-start.y)/stage.getBoundingClientRect().height;
if(start.handle==='move'){r.x=clamp(r.x+dx,.003,1-r.w-.003);r.y=clamp(r.y+dy,.003,1-r.h-.003)}else{let l=r.x,t=r.y,rr=r.x+r.w,bb=r.y+r.h; if(start.handle.includes('l'))l=clamp(l+dx,.003,rr-.08);if(start.handle.includes('r'))rr=clamp(rr+dx,l+.08,.997);if(start.handle.includes('t'))t=clamp(t+dy,.003,bb-.08);if(start.handle.includes('b'))bb=clamp(bb+dy,t+.08,.997);r.x=l;r.y=t;r.w=rr-l;r.h=bb-t}
draft[side][start.type]=r;draft[side].verified=true;draft[side].reliable=false;updateRect(start.type)});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,e=>{if(start&&(!('pointerId' in e)||e.pointerId===start.id))start=null});
updateMeasures()}
async function processPhoto(source){const side=step===0?'front':'back';try{
 let detected=null;
 try{detected=window.CardDetector?.analyze(source)}catch(e){console.warn('Automatic detector:',e)}
 if(detected?.ok){draft[side]={data:detected.data,outer:detected.outer,inner:detected.inner,detected:true,verified:false,perspectiveCorrected:true,confidence:detected.confidence,reliable:detected.reliable,reason:detected.reason};render();toast(detected.reliable?'Card and print edges found. Check the score.':'Card outline found. Please verify the blue printed-border guide.');return}
 // If automation cannot isolate the card, preserve the photo and enable a manual alignment.
 const w=source.videoWidth||source.naturalWidth||source.width,h=source.videoHeight||source.naturalHeight||source.height;
 const c=document.createElement('canvas'),k=Math.min(1,1100/Math.max(w,h));c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(source,0,0,c.width,c.height);
 const guide=autoBounds(c);draft[side]={data:c.toDataURL('image/jpeg',.82),...guide,detected:false,verified:false,reliable:false,reason:(detected?.reason||'Could not automatically find all four edges')+'. Move the gold and blue guides manually.'};render();toast('Automatic detection uncertain. Align the guides manually.');
 }catch(e){console.error(e);toast('Could not analyse this image. Try again in better light.')}}
async function loadPhoto(file){if(!file)return;if(!file.type.startsWith('image/')){toast('Please choose an image file.');return}try{const url=URL.createObjectURL(file);let img;try{img=await imageFromData(url)}finally{URL.revokeObjectURL(url)}await processPhoto(img)}catch(e){console.error(e);toast('Could not load that photo. Try JPG or PNG.')}}
function createDemoPhoto(back=false){const c=document.createElement('canvas');c.width=510;c.height=700;const x=58,y=49,w=390,h=552,ctx=c.getContext('2d');ctx.fillStyle='#283041';ctx.fillRect(0,0,510,700);for(let i=0;i<260;i++){ctx.fillStyle=`rgba(255,255,255,${(i%7)*.002})`;ctx.fillRect((i*53)%510,(i*97)%700,2,2)}
ctx.fillStyle=back?'#102e7c':'#cbaa63';roundRect(ctx,x,y,w,h,16,true);const inset=back?20:25;ctx.fillStyle=back?'#294ba6':'#6a548c';roundRect(ctx,x+inset,y+inset,w-2*inset,h-2*inset,8,true);
if(back){const grad=ctx.createRadialGradient(255,320,15,255,320,250);grad.addColorStop(0,'#ebcb76');grad.addColorStop(.18,'#2957b7');grad.addColorStop(.7,'#123281');grad.addColorStop(1,'#061748');ctx.fillStyle=grad;ctx.fillRect(x+34,y+34,w-68,h-68);for(let n=0;n<6;n++){ctx.strokeStyle=n%2?'#daa946':'#85aef2';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(255,318,70+n*18,90+n*20,n*.23,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#f0d38a';ctx.font='bold 31px Arial';ctx.textAlign='center';ctx.fillText('SAMPLE',255,335);ctx.font='18px Arial';ctx.fillText('NOT A REAL CARD',255,366)}else{ctx.fillStyle='#e0d09b';ctx.fillRect(x+31,y+27,w-62,43);ctx.fillStyle='#292d46';ctx.font='bold 27px Arial';ctx.fillText('SKY DRAKE',x+44,y+57);ctx.fillStyle='#131d43';const g=ctx.createLinearGradient(0,y+80,0,y+410);g.addColorStop(0,'#4c4a9c');g.addColorStop(1,'#212b53');ctx.fillStyle=g;ctx.fillRect(x+34,y+83,w-68,320);ctx.fillStyle='#9b8ed1';ctx.beginPath();ctx.moveTo(249,220);ctx.bezierCurveTo(115,80,70,205,210,336);ctx.lineTo(255,290);ctx.bezierCurveTo(440,100,478,232,273,317);ctx.fill();ctx.fillStyle='#232a52';ctx.beginPath();ctx.ellipse(252,304,57,116,-.15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efcf6f';ctx.beginPath();ctx.arc(273,221,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4d9f0';ctx.font='bold 24px Arial';ctx.fillText('TEMPEST WING   90',x+45,y+453);ctx.font='17px Arial';ctx.fillText('A fantasy test card — demo only',x+45,y+493)}const fit=imageFit(510,700,600,773);const pxRect=(xx,yy,ww,hh)=>({x:(fit.x+xx*fit.w/510)/600,y:(fit.y+yy*fit.h/700)/773,w:(ww*fit.w/510)/600,h:(hh*fit.h/700)/773});return {data:c.toDataURL('image/jpeg',.88),outer:pxRect(x,y,w,h),inner:pxRect(x+inset,y+inset,w-2*inset,h-2*inset)}}
function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill()}
function startDemo(){activeId=null;draft=newDraft();draft.name='Sky Drake';draft.set='Demo collection';draft.number='001/100';draft.front=createDemoPhoto();draft.back=createDemoPhoto(true);draft.quality={corners:'tiny',edges:'clean',surface:'tiny'};step=2;view='result';render();toast('Sample card loaded. Demo grades and artwork are illustrative, not eBay data.')} 
function beginNewScan(){stopCamera();draft=newDraft();activeId=null;editingSourceId=null;step=0;priceFilter='Raw';nav('scan')}
let editingSourceId=null;
function enterEdit(side){stopCamera();const original=active();if(!hasPhotos(original)){toast('Scan both card sides first.');return}editingSourceId=activeId;draft=JSON.parse(JSON.stringify(original));activeId=null;step=side==='front'?0:1;nav('scan')}
function downloadBackup(){if(!library.length){toast('Your collection is empty.');return}const blob=new Blob([JSON.stringify({app:'CardGrade AI',version:1,exportedAt:new Date().toISOString(),cards:library},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cardgrade-collection-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Collection backup exported.')}
function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{if(!inp.files?.[0])return;try{const obj=JSON.parse(await inp.files[0].text());const cards=Array.isArray(obj)?obj:obj.cards;if(!Array.isArray(cards)||cards.length>300)throw new Error('Invalid backup');let added=0;for(const card of cards){if(!card||typeof card!=='object'||!card.front?.data||!card.back?.data||typeof card.front.data!=='string'||typeof card.back.data!=='string')continue;if(!card.front.data.startsWith('data:image/')||!card.back.data.startsWith('data:image/'))continue;const id=typeof card.id==='string'?card.id:'cg-'+Date.now()+'-'+added;if(library.some(c=>c.id===id))continue;library.push({...card,id,comps:Array.isArray(card.comps)?card.comps:[],quality:card.quality||{corners:'unknown',edges:'unknown',surface:'unknown'}});added++}persist();render();toast(`${added} card${added===1?'':'s'} imported.`)}catch{toast('Could not read that backup file.')}};inp.click()}
function saveEditedCard(){if(editingSourceId){const i=library.findIndex(x=>x.id===editingSourceId);if(i>=0){library[i]={...JSON.parse(JSON.stringify(draft)),id:editingSourceId};activeId=editingSourceId;editingSourceId=null;if(persist()){toast('Changes saved to the card.');render()}return}}saveCard()}
function addComp(){const c=active(),price=Number($('#compPrice')?.value),date=$('#compDate')?.value||'',url=$('#compUrl')?.value.trim()||'';if(!Number.isFinite(price)||price<=0||price>10000000){toast('Enter a valid sold price.');return}if(url&&safeUrl(url)==='#'){toast('Please enter a valid listing URL.');return}c.comps??=[];c.comps.unshift({id:'comp-'+Date.now()+'-'+Math.floor(Math.random()*9999),type:priceFilter,price:Math.round(price*100)/100,date,url});if(activeId)persist();render();toast('Sold comparison recorded. '+(!activeId?'Remember to save this card.':''))}
function deleteCard(id){const c=library.find(x=>x.id===id);if(!c)return;if(!window.confirm(`Delete ${c.name||'this card'} and its saved images? This cannot be undone.`))return;library=library.filter(c=>c.id!==id);if(activeId===id){activeId=null;draft=newDraft()}persist();render();toast('Card deleted.')}
async function autoGuides(){const side=step===0?'front':'back',p=draft[side];if(!p)return;try{const img=await imageFromData(p.data);const found=window.CardDetector?.analyze(img);if(found?.ok){p.data=found.data;p.outer=found.outer;p.inner=found.inner;p.reliable=found.reliable;p.verified=false;p.detected=true;p.perspectiveCorrected=true;p.reason=found.reason;p.confidence=found.confidence;render();toast(found.reliable?'Edges re-detected. Review the score.':'Borders suggested. Verify the guides.')}else{const guides=autoBounds(img);p.outer=guides.outer;p.inner=guides.inner;p.reliable=false;p.verified=false;p.reason='Automatic detection uncertain. Please adjust the guides.';render();toast('Automatic detection uncertain. Check guides manually.')}}catch(e){console.error(e);toast('Could not analyse the image.')}}
async function handleAction(action,elem){switch(action){
 case 'new-scan':beginNewScan();break;
 case 'demo':startDemo();break;
 case 'open-camera':await openCamera();break;
 case 'close-camera':stopCamera();render();break;
 case 'capture-frame':await captureFrame();break;
 case 'take-photo':stopCamera();$('#cameraFile').value='';$('#cameraFile').click();break;
 case 'upload-photo':case 'replace-photo':$('#galleryFile').value='';$('#galleryFile').click();break;
 case 'auto-guides':await autoGuides();break;
 case 'confirm-side':{const side=step===0?'front':'back',m=measure(draft[side]);if(!m){toast('The blue border must be inside the gold border on all four sides.');return}draft[side].verified=true;step=step===0?1:2;render();break}
 case 'edit-front':enterEdit('front');break;
 case 'edit-back':enterEdit('back');break;
 case 'show-result':if(!hasPhotos(draft)){toast('Capture both sides first.');return}activeId=null;nav('result');break;
 case 'save':saveEditedCard();break;
 case 'open-card':{const id=elem.dataset.id;if(!library.some(c=>c.id===id))return;activeId=id;editingSourceId=null;nav('result');break}
 case 'delete-card':deleteCard(elem.dataset.id);break;
 case 'price-type':priceFilter=elem.dataset.type;render();break;
 case 'add-comp':addComp();break;
 case 'delete-comp':{const c=active();c.comps=(c.comps||[]).filter(x=>x.id!==elem.dataset.id);if(activeId)persist();render();toast('Comparison removed.');break}
 case 'export':downloadBackup();break;
 case 'import':importBackup();break;
 default:break;
}}
document.addEventListener('click',e=>{const link=e.target.closest('[data-nav]');if(link){e.preventDefault();if(link.dataset.nav==='scan'&&view!=='scan'&&(activeId||hasPhotos(draft)&&step===2)){beginNewScan()}else nav(link.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){e.preventDefault();handleAction(action.dataset.action,action)}});
document.addEventListener('input',e=>{const k=e.target.dataset.field;if(k&&['name','set','number'].includes(k)){draft[k]=e.target.value.slice(0,140)}});
document.addEventListener('change',e=>{const k=e.target.dataset.quality;if(k&&['corners','edges','surface'].includes(k)){const c=view==='scan'?draft:active();c.quality??={};c.quality[k]=e.target.value;if(activeId)persist();if(view==='result'){const scroll=main.scrollTop;render();main.scrollTop=scroll}}});
$('#cameraFile').addEventListener('change',e=>loadPhoto(e.target.files?.[0]));
$('#galleryFile').addEventListener('change',e=>loadPhoto(e.target.files?.[0]));
$('#backBtn').addEventListener('click',()=>{if(view==='help')nav('home');else if(view==='result'){if(activeId)nav('library');else{step=2;nav('scan')}}else nav('home')});
$('#helpBtn').addEventListener('click',()=>nav('help'));
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
