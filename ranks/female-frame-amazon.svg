  <linearGradient id="shimmerMetal" x1="0%" y1="0%" x2="100%" y2="80%"><stop stop-color="#cf8c9d"/><stop offset=".4" stop-color="#ffddce"/><stop offset="1" stop-color="#7f405b"/></linearGradient>
  <radialGradient id="face" cx="42%" cy="27%" r="82%"><stop stop-color="#7f405b"/><stop offset=".49" stop-color="#271723"/><stop offset="1" stop-color="#09080e"/></radialGradient>
  <radialGradient id="gem"><stop stop-color="#ffddce"/><stop offset=".5" stop-color="#e7a4ad"/><stop offset="1" stop-color="#7f405b"/></radialGradient>
  <radialGradient id="pulseStroke"><stop stop-color="#ffddce" stop-opacity=".92"/><stop offset=".45" stop-color="#e7a4ad" stop-opacity=".9"/><stop offset="1" stop-color="#cf8c9d" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="4"/></filter>
