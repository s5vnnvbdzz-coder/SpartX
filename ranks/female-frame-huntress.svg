<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="title desc">
<title id="title">SpartanX Huntress female rank portrait frame</title>
<desc id="desc">A transparent portrait frame with huntress tier detailing and a centre-out glow every 2.25 seconds. The centre remains transparent for the user's photo.</desc>
<defs>
  <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#f5eaff"/><stop offset=".24" stop-color="#c2a7ef"/><stop offset=".52" stop-color="#684a90"/><stop offset=".76" stop-color="#c2a7ef"/><stop offset="1" stop-color="#f5eaff"/></linearGradient>
  <linearGradient id="metalLight" x1="0%" y1="100%" x2="100%" y2="0%"><stop stop-color="#684a90"/><stop offset=".48" stop-color="#f5eaff"/><stop offset="1" stop-color="#c2a7ef"/></linearGradient>
  <linearGradient id="shimmerMetal" x1="0%" y1="0%" x2="100%" y2="80%"><stop stop-color="#c2a7ef"/><stop offset=".4" stop-color="#f5eaff"/><stop offset="1" stop-color="#684a90"/></linearGradient>
  <radialGradient id="face" cx="42%" cy="27%" r="82%"><stop stop-color="#684a90"/><stop offset=".49" stop-color="#181325"/><stop offset="1" stop-color="#09080e"/></radialGradient>
  <radialGradient id="gem"><stop stop-color="#f5eaff"/><stop offset=".5" stop-color="#c6b4f4"/><stop offset="1" stop-color="#684a90"/></radialGradient>
  <radialGradient id="pulseStroke"><stop stop-color="#f5eaff" stop-opacity=".92"/><stop offset=".45" stop-color="#c6b4f4" stop-opacity=".9"/><stop offset="1" stop-color="#c2a7ef" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="portraitHole" clipPathUnits="userSpaceOnUse"><path clip-rule="evenodd" d="M0 0H320V320H0Z M238 160 A78 78 0 1 0 82 160 A78 78 0 1 0 238 160Z"/></clipPath>
 </defs>
<style>@media (prefers-reduced-motion: reduce) { .frame-radiance { display: none } }</style>
