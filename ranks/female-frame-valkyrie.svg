<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="title desc">
<title id="title">SpartanX Valkyrie female rank portrait frame</title>
<desc id="desc">A transparent portrait frame with valkyrie tier detailing and a centre-out glow every 2.25 seconds. The centre remains transparent for the user's photo.</desc>
<defs>
  <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#f1f4ff"/><stop offset=".24" stop-color="#a3b0e7"/><stop offset=".52" stop-color="#506aa3"/><stop offset=".76" stop-color="#a3b0e7"/><stop offset="1" stop-color="#f1f4ff"/></linearGradient>
  <linearGradient id="metalLight" x1="0%" y1="100%" x2="100%" y2="0%"><stop stop-color="#506aa3"/><stop offset=".48" stop-color="#f1f4ff"/><stop offset="1" stop-color="#a3b0e7"/></linearGradient>
  <linearGradient id="shimmerMetal" x1="0%" y1="0%" x2="100%" y2="80%"><stop stop-color="#a3b0e7"/><stop offset=".4" stop-color="#f1f4ff"/><stop offset="1" stop-color="#506aa3"/></linearGradient>
  <radialGradient id="face" cx="42%" cy="27%" r="82%"><stop stop-color="#506aa3"/><stop offset=".49" stop-color="#151e34"/><stop offset="1" stop-color="#09080e"/></radialGradient>
  <radialGradient id="gem"><stop stop-color="#f1f4ff"/><stop offset=".5" stop-color="#b3c9fb"/><stop offset="1" stop-color="#506aa3"/></radialGradient>
  <radialGradient id="pulseStroke"><stop stop-color="#f1f4ff" stop-opacity=".92"/><stop offset=".45" stop-color="#b3c9fb" stop-opacity=".9"/><stop offset="1" stop-color="#a3b0e7" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="portraitHole" clipPathUnits="userSpaceOnUse"><path clip-rule="evenodd" d="M0 0H320V320H0Z M238 160 A78 78 0 1 0 82 160 A78 78 0 1 0 238 160Z"/></clipPath>
 </defs>
<style>@media (prefers-reduced-motion: reduce) { .frame-radiance { display: none } }</style>
